name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A0D12F: ${{ secrets.A0D12F }}
          B8C254: ${{ secrets.B8C254 }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A0D12F', '')
          sec_b = os.environ.get('B8C254', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- cb2a1ace2f8aeb3098 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- 2101864453e32e4cb96213fa237b749a57e656a7793aa0 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
