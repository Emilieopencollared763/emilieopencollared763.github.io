# Site settings. Built on RayeRen/acad-homepage.github.io (MIT); see LICENSE.
title                    : "Shengqi Yuan"
description              : "Shengqi Yuan, M.S. student in Computer Science and Engineering at UC San Diego. Robotics software, lab automation and agent systems."
url                      : "https://zzyzhbs.github.io"
repository               : "zzyzhbs/zzyzhbs.github.io"

# Site author (left column)
author:
  name             : "Shengqi Yuan"
  avatar           : "images/profile.png"
  bio              : "M.S. in Computer Science and Engineering, UC San Diego, Class of 2027<br>B.Eng. in Computer Science, Wuhan University, 2025"
  email            : "s7yuan@ucsd.edu"
  github           : "zzyzhbs"
  linkedin         : "shengqi-yuan"
  # cv            : "pdf/Shengqi_Yuan_Resume_EN.pdf"   # re-enable when the new résumé is ready

# Reading files
include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - node_modules
  - .bundle
  - .sass-cache
  - .jekyll-cache
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: America/Los_Angeles

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from

compress_html:
  clippings: all
  ignore:
    envs: development
